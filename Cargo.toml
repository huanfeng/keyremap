[package]
name = "keyremap"
version = "0.5.3"
edition = "2024"
description = "Windows 键盘/鼠标重映射工具"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",          # Shell_NotifyIconW 托盘图标 / ShellExecuteW
    "Win32_System_LibraryLoader", # GetModuleHandleW: 注册窗口类与加载图标资源
    "Win32_Graphics_Gdi",      # WNDCLASSW 里的 HBRUSH 等字段类型
    "Win32_System_Threading",  # CreateMutexW / GetCurrentThreadId
    "Win32_System_Console",    # 按需附加控制台
    "Win32_Storage_FileSystem", # CreateFileW: 重新打开 CONOUT$/CONIN$
    "Win32_UI_HiDpi",          # SetProcessDpiAwarenessContext: 菜单与图标不发虚
    "Win32_UI_Accessibility",  # SetWinEventHook: 跟踪前台窗口, 按程序区分映射
    "Win32_UI_Input_Ime",      # ImmDisableIME: 不让输入法把自己加载进本进程
    "Win32_Security",          # CreateMutexW 参数类型 / 提权状态检测
    "Win32_System_Registry",   # 开机自启动: HKCU\...\Run
] }
# 关掉 default features: macos_fsevent 是其他平台专用的
notify-debouncer-mini = { version = "0.7", default-features = false }

[profile.release]
lto = true
strip = true
codegen-units = 1
# panic=abort 对钩子回调是有利的: panic 跨 FFI 边界属于未定义行为,
# 直接 abort 比放任 unwind 穿过 Windows 的调用栈安全。
panic = "abort"
