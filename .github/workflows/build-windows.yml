name: Build Windows

on:
  push:
    branches:
      - BoHeZi-patch-1
  pull_request:
    branches:
      - BoHeZi-patch-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build keyremap.exe
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\keyremap.exe dist\keyremap.exe
          if (Test-Path keyremap.toml) {
            Copy-Item keyremap.toml dist\keyremap.toml
          }
          Compress-Archive -Path dist\* -DestinationPath keyremap-windows-x86_64.zip -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyremap-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/keyremap.exe
            keyremap-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
